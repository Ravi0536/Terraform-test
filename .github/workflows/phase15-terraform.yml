name: Phase 15 disposable Terraform validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'phase15/e2e/s3-public-0729/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase15-terraform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phase15/e2e/s3-public-0729
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive
      - name: Initialize without remote state
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate -no-color

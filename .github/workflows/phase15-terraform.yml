name: Phase 15 disposable Terraform validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'generated/**'
      - 'phase15/e2e/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase15-terraform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TF_WORKING_DIR: generated

jobs:
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select changed Terraform root
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -q '^phase15/e2e/'; then
            echo "TF_WORKING_DIR=phase15/e2e" >> "$GITHUB_ENV"
          fi
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.5
          terraform_wrapper: false
      - name: Format
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive
      - name: Initialize without remote state
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false -input=false
      - name: Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate -no-color
